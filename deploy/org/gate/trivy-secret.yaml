# Extra secret rules for the image gate (image-gate.py check A1), added to trivy's built-in rules.
# The built-in set already covers AWS, GitHub, Google, Slack, Stripe, private-key blocks and many more; these are the
# keys this program's own stack uses, which a general scanner has no reason to know the shape of.
rules:
  - id: openrouter-api-key
    category: OpenRouter
    title: OpenRouter API key
    severity: CRITICAL
    regex: 'sk-or-v1-[0-9a-f]{64}'
    keywords:
      - 'sk-or-v1-'
  - id: anthropic-api-key
    category: Anthropic
    title: Anthropic API key
    severity: CRITICAL
    regex: 'sk-ant-[A-Za-z0-9_\-]{32,}'
    keywords:
      - 'sk-ant-'
  - id: agentfield-style-hex-key-assignment
    category: AgentField
    title: A 64-hex-character value assigned to a key, token or secret variable
    severity: HIGH
    regex: '(?i)(?:api_?key|token|secret|server_?key)[a-z0-9_]*["'']?\s*[:=]\s*["'']?[0-9a-f]{64}\b'
    keywords:
      - 'key'
      - 'token'
      - 'secret'
