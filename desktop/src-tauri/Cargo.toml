[package]
name = "codeaf-app"
version = "0.1.0"
description = "codeaf desktop workspace"
authors = ["Santosh Kumar Radha"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codeaf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
# Native choosers and notifications are reached only through codeaf's own typed
# commands (dialogs.rs, notifications.rs); the renderer is granted neither plugin.
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The mock runtime drives the native-controls commands through real IPC in tests.
[dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
