[package]
name = "codeaf-app"
version = "0.1.0"
description = "codeaf desktop workspace"
authors = ["Santosh Kumar Radha"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codeaf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-shell = "2"
# Native choosers and notifications are reached only through codeaf's own typed
# commands (dialogs.rs, notifications.rs); the renderer is granted neither plugin.
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
# codeaf:// links (links.rs). The renderer is granted no deep-link permission: a
# link reaches it only through codeaf's own `link_claim` command, after links.rs
# has refused anything that is not a codeaf link.
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = { version = "=2.8.1", default-features = false }

# On Linux and Windows a codeaf:// link launches a second process; this hands
# the link to the running codeaf instead (its deep-link feature routes it to
# links.rs). macOS delivers links to the running app itself.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

# Native web tabs read history, failures and snapshots from the platform view
# Tauri already embeds (web.rs). These crates are already in the graph through
# wry; listing them only names the features web.rs calls.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
# A notification click (activation.rs) is heard on the session bus that the
# notification plugin and single-instance already use.
zbus = "5"

# The notification plugin drops click actions on desktop. activation.rs posts
# through the same platform crates the plugin already uses, so a click can
# reach codeaf.
[target.'cfg(target_os = "macos")'.dependencies.mac-notification-sys]
version = "0.6"

[target.'cfg(windows)'.dependencies.tauri-winrt-notification]
version = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSValue", "NSString", "NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration", "WKNavigation"] }

# The mock runtime drives the native-controls and native-web commands through real IPC in tests.
[dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable", "test"] }

# A real window with a real child webview; it needs a display and runs only
# with CODEAF_WEB_SMOKE=1 (see the file).
[[test]]
name = "web_smoke"
harness = false

# A real notification click over a private session bus; it needs a display and
# runs only with CODEAF_NOTIFY_SMOKE=1 (see the file).
[[test]]
name = "notification_click_smoke"
harness = false


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
