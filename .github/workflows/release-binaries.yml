name: Release binaries

# NOTHING HERE PUBLISHES BY ITSELF. A release is a person deciding to cut one,
# and the only thing that starts one is a semver tag. There is deliberately no
# branch trigger: a merge landing on a branch must never turn into a download
# somebody else installs, because the whole point of `staging` is that a build
# is soaked before it is offered.
#
# AND A RELEASE COMES OFF `staging`. The publish job below refuses a tag whose
# commit is not on that branch, so the ordering — dev, then staging, then a tag
# — cannot be skipped by tagging the wrong thing. docs/rules/promotion.md is the
# runbook.
#
# workflow_dispatch builds the six binaries and uploads them as workflow
# artifacts so a build can be looked at. It does not publish; only a tag does.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # What this build calls itself, decided once and read by both the compiler
  # and the publisher. Two jobs computing it separately is two chances for the
  # stamped string and the release tag to drift apart, which is precisely the
  # confusion a version number exists to prevent.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      title: ${{ steps.resolve.outputs.title }}
      latest: ${{ steps.resolve.outputs.latest }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            title="AForge ${tag}"
            # Only a complete semver release takes the "Latest" badge. A
            # prerelease tag (v0.2.0-rc.1) is published and left unmarked, so
            # anything resolving "latest" keeps pointing at the last stable one.
            # A bash regex rather than a pipe into grep: under pipefail a
            # `printf | grep -q` pipeline can report the writer's SIGPIPE
            # instead of grep's verdict and silently take the wrong branch.
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest=true
              prerelease=false
            else
              latest=false
              prerelease=true
            fi
          else
            # A manual dispatch, which builds and never publishes. The name is
            # still computed so the artifacts are labelled with the commit they
            # came from rather than with an empty string.
            tag="build-${GITHUB_SHA::12}"
            title="AForge ${GITHUB_SHA::12}"
            latest=false
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "title=${title}"
            echo "latest=${latest}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "version ${tag} (latest=${latest} prerelease=${prerelease})"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The narrow suite around the things a shipped binary depends on to start
      # at all. The whole suite already ran on the way into `staging`, and the
      # tag is on `staging` or the publish refused — so this is a last look at
      # the release surface, not a second full check.
      #
      # It honours .github/known-red.txt for the same reason ci-full.yml does:
      # a release must not be blocked by a failure somebody already owes, and it
      # must be blocked by any other one.
      - name: Test release surface
        run: |
          set -euo pipefail
          skip="$(grep -v -e '^#' -e '^[[:space:]]*$' .github/known-red.txt | paste -sd'|' -)"
          go test -skip "^(${skip})$" \
            ./cmd/aforge \
            ./internal/config \
            ./internal/exec/... \
            ./internal/filelock \
            ./internal/lease

  build:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          AFORGE_REV="$(git rev-parse --short HEAD)"
          AFORGE_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -trimpath \
            -ldflags="-s -w -X github.com/Agent-Field/aforge-v2/internal/buildinfo.rev=${AFORGE_REV} -X github.com/Agent-Field/aforge-v2/internal/buildinfo.dirty=false -X github.com/Agent-Field/aforge-v2/internal/buildinfo.builtAt=${AFORGE_BUILT_AT}" \
            -o "dist/aforge-${GOOS}-${GOARCH}${{ matrix.extension }}" \
            ./cmd/aforge
      - uses: actions/upload-artifact@v4
        with:
          name: aforge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    # A manual dispatch builds and uploads artifacts and stops there. Publishing
    # is a consequence of a tag and of nothing else.
    if: github.ref_type == 'tag'
    needs: [build, version]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # THE TAG HAS TO BE ON `staging`. Tagging is the one step of the promotion
      # that no branch rule can police — a tag can be cut anywhere, including on
      # a dev commit that has soaked nowhere. So it is policed here, before a
      # single byte is published, and the failure names the fix.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on staging
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/staging:refs/remotes/origin/staging
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/staging; then
            echo
            echo "Refusing to publish ${GITHUB_REF_NAME}."
            echo "${GITHUB_SHA} is not on origin/staging, so this commit has not"
            echo "been through the full check and has soaked nowhere."
            echo
            echo "Promote it first — docs/rules/promotion.md — then tag the commit"
            echo "that staging points at."
            exit 1
          fi
          echo "${GITHUB_SHA} is on origin/staging."
      - uses: actions/download-artifact@v4
        with:
          pattern: aforge-*
          path: dist
          merge-multiple: true
      # THE RELEASE NOTES ARE THE CHANGELOG, so that rolling it up is the release
      # note rather than paperwork somebody does afterwards and nobody reads.
      # A tag whose section is missing still publishes — with generated notes and
      # a warning — because a release must not be blocked by prose.
      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if awk -v tag="## ${TAG} " 'index($0, tag) == 1 {f=1; next} f && /^## / {exit} f' \
               CHANGELOG.md > notes.md && [ -s notes.md ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Release notes taken from the ${TAG} section of CHANGELOG.md."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md has no '## ${TAG}' section. Falling back to generated notes."
            echo "Roll it up next time: make changelog VERSION=${TAG}"
          fi

      - name: Write checksums
        working-directory: dist
        run: sha256sum aforge-* > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TITLE: ${{ needs.version.outputs.title }}
          LATEST: ${{ needs.version.outputs.latest }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          HAVE_NOTES: ${{ steps.notes.outputs.have }}
        run: |
          set -euo pipefail
          if [ "$LATEST" = "true" ]; then
            marks=(--latest --prerelease=false)
          else
            marks=(--latest=false --prerelease)
          fi
          if [ "$HAVE_NOTES" = "true" ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${marks[@]}"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              "${notes[@]}" \
              "${marks[@]}"
          fi
