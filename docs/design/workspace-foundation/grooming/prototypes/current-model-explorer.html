 if(n.type==='collection'){return'<dl>'+field('Name',n.payload.name)+field('Stable identity',n.payload.id)+field('Direct members',n.members.length)+'</dl><p class="af-caption">A collection stores its name and memberships. Execution state remains with the referenced owners.</p>';}
 return'<dl>'+field('Availability',n.resolved.available?'Available':'Unavailable')+field('Reason',n.resolved.unavailable)+field('State',n.resolved.state)+field('Phase',n.resolved.phase)+field('Location',n.resolved.location)+field('Identity',n.ref.id)+(n.ref.session_id?field('Owning conversation',n.ref.session_id):'')+'</dl>'+(n.type==='artifact'?'<p class="af-caption">File identity is its absolute path. A missing path does not erase its saved collection reference.</p>':'')+(n.sampleText?'<p class="af-summary">'+esc(n.sampleText)+'</p>':'');}
function connections(n){let list=edges.filter(e=>e.from===n.id||e.to===n.id);if(n.type==='context'){const r=rev(n);list=[];const src=recordFor(r.source);if(src)list.push({from:src.id,to:n.id,label:'Source conversation',field:'source'});r.targets.forEach(t=>{const a=recordFor(t);if(a)list.push({from:n.id,to:a.id,label:'Explicit target',field:'targets'});});}return(list.length?list.slice(0,30).map(e=>{const other=byId.get(e.from===n.id?e.to:e.from);return'<div class="af-source"><p class="af-caption">'+esc(e.label)+' · '+esc(e.field)+'</p>'+recordButton(other)+'</div>';}).join(''):'<p class="af-empty">No connection is recorded for this item.</p>')+(list.length>30?'<p class="af-caption">Showing 30 of '+list.length+' links.</p>':'');}
function history(n){if(n.type==='context')return'<p class="af-caption" style="margin-bottom:15px">Each revision retains its own text, source, targets and withdrawal state.</p>'+n.revisions.map(r=>'<div class="af-history '+(r.revision===rev(n).revision?'af-used':'')+'"><button type="button" class="af-link" data-revision="'+r.revision+'">Revision '+r.revision+(r.withdrawn?' · withdrawn':r.revision===n.payload.revision?' · current':'')+'</button><p>'+esc(r.text)+'</p><p>Source: '+esc(recordFor(r.source)?.title||r.source.id)+'</p></div>').join('');if(n.item){const i=n.item;return'<dl>'+field('Last checked',i.lastChecked)+field('Latest check',i.lastCheckLine)+field('Next due',i.nextDue)+field('Firings',i.runs)+field('Last outcome',i.lastOutcome)+field('Last run location',i.lastRun)+'</dl>'+(n.notes||[]).map(note=>'<div class="af-history"><p>'+esc(note.at)+'</p><strong>'+esc(note.kind)+'</strong><p>'+esc(note.text)+'</p></div>').join('')+'<p class="af-caption">Quiet checks update the latest check fields. This is not a complete history of every check.</p>';}return raw(n);}
function raw(n){const data=n.type==='context'?rev(n):n.type==='collection'?{collection:n.payload,members:n.members}:n.item?{resolved:n.resolved,item:n.item}:n.resolved;return'<pre class="af-raw">'+esc(JSON.stringify(data,null,2))+'</pre>';}
function detail(n){const label=n.type==='context'?(rev(n).withdrawn?'Withdrawn context':'Shared context · revision '+rev(n).revision):n.type==='collection'?'Collection':n.resolved?.available===false?'Unavailable':n.resolved?.state||typeNames[n.type];const third=n.type==='context'?'Revisions':n.type==='standing'?'Activity':'Stored fields';return'<div class="af-status">'+esc(label)+'</div><div class="af-sidehead"><h2>'+esc(n.title)+'</h2><button class="af-close" type="button" data-action="close-record">Close</button></div><button class="af-mainaction" type="button" data-action="trace-selected">Show recorded connections <i data-lucide="arrow-up-right" aria-hidden="true"></i></button><div class="af-tabs" aria-label="Record detail"><button type="button" data-tab="record" aria-pressed="'+(state.tab==='record')+'">Record</button><button type="button" data-tab="connections" aria-pressed="'+(state.tab==='connections')+'">Connections</button><button type="button" data-tab="history" aria-pressed="'+(state.tab==='history')+'">'+third+'</button></div><div class="af-tabcontent">'+(state.tab==='record'?properties(n):state.tab==='connections'?connections(n):history(n))+'</div>'+(n.type==='context'||n.type==='standing'?'<details class="af-section"><summary>Stored fields</summary>'+raw(n)+'</details>':'');}
function notes(){return'<div class="af-sidehead"><h2>Built from today’s model</h2><button type="button" class="af-close" data-action="home">Close</button></div><p class="af-summary">New viewer, synthetic data. No connection to your real workspace.</p><div class="af-foundation"><strong>Collection store</strong>Stable folder IDs, ordered typed memberships and multiple parents. The same file or task can appear in several places.</div><div class="af-foundation"><strong>Shared-context store</strong>Text, a source reference, explicit targets, immutable revisions and withdrawal. Context is information, not permission.</div><div class="af-foundation"><strong>Existing record owners</strong>Conversations, task ownership and projected state, file availability, and ongoing items with origin, schedule, grant and retained activity.</div><div class="af-foundation"><strong>What this cannot claim</strong>A complete explanation of a model’s decision; automatic memory provenance; or the exact shared-context revision consumed by a particular run.</div><div class="af-foundation"><strong>Historical limits</strong>Quiet checks overwrite latest-check fields. Some old run data can be removed. The task index is not a complete census of every task ever created.</div><div class="af-foundation"><strong>Code inspected</strong>workspace · workspaceview · standing, on the personal-ai-backend review branch. Shared context belongs to draft #662; this viewer is not a shipped aforge screen.</div>';}
function panel(){side.innerHTML=state.panel==='notes'?notes():state.panel==='record'&&state.selected?detail(byId.get(state.selected)):state.panel==='browse'||state.q?browse():summaryHome();icons();}
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!root.contains(b))return;const d=b.dataset;if(d.folder){openFolder(d.folder);return;}if(d.topic){openTopic(d.topic);return;}if(d.record){select(d.record);return;}if(d.trace){trace(d.trace);return;}if(d.tab){state.tab=d.tab;panel();return;}if(d.revision){state.revision=Number(d.revision);state.revisionById[state.selected]=state.revision;state.tab='record';panel();schedule();announce('Showing retained revision '+d.revision);return;}
 switch(d.action){case'home':home();break;case'in':fly(state.camera.x,state.camera.y,state.camera.k*1.6);break;case'out':fly(state.camera.x,state.camera.y,state.camera.k/1.6);break;case'foundations':state.panel='notes';panel();break;case'next':state.page++;panel();break;case'prev':state.page=Math.max(0,state.page-1);panel();break;case'close-record':if(state.mode==='trace')home();else{state.selected=null;state.panel='browse';panel();schedule();}break;case'trace-selected':trace(state.selected);break;}});
$('input[type=search]').addEventListener('input',ev=>{state.q=ev.target.value.trim();state.page=0;state.panel=state.q?'browse':state.selected?'record':'home';panel();});
canvas.addEventListener('wheel',ev=>{if(state.mode!=='map')return;ev.preventDefault();cancelAnimationFrame(anim);const r=canvas.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,wx=(x-W/2)/(scale*state.camera.k)+state.camera.x,wy=(y-H/2)/(scale*state.camera.k)+state.camera.y,k=Math.max(.75,Math.min(15,state.camera.k*Math.exp(-ev.deltaY*.002)));state.camera={x:wx-(x-W/2)/(scale*k),y:wy-(y-H/2)/(scale*k),k};schedule();},{passive:false});
canvas.addEventListener('pointerdown',ev=>{if(state.mode!=='map')return;cancelAnimationFrame(anim);drag={x:ev.clientX,y:ev.clientY,ox:ev.clientX,oy:ev.clientY,moved:false};canvas.setPointerCapture(ev.pointerId);});
canvas.addEventListener('pointermove',ev=>{if(!drag){canvas.style.cursor='grab';return;}const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;state.camera.x-=dx/(scale*state.camera.k);state.camera.y-=dy/(scale*state.camera.k);drag.x=ev.clientX;drag.y=ev.clientY;drag.moved=drag.moved||Math.hypot(ev.clientX-drag.ox,ev.clientY-drag.oy)>5;schedule();});
canvas.addEventListener('pointerup',ev=>{const d=drag;drag=null;if(!d||d.moved)return;const r=canvas.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;let best=null,dist=16;for(const n of drawn){const v=Math.hypot(n.x-x,n.y-y);if(v<dist){dist=v;best=n;}}if(best)select(best.n.id);});canvas.addEventListener('pointercancel',()=>drag=null);
new ResizeObserver(resize).observe(stage);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',colors);chrome();panel();colors();resize();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:schedule});tweak.addSelect(state,'density',{label:'Record labels',options:[{label:'Quiet',value:'quiet'},{label:'More detail',value:'rich'}]});}
root.afPrototype={getState:()=>({mode:state.mode,selected:state.selected,recordCount:records.length,collectionCount:collections.length,camera:{...state.camera}}),records,collections,edges,collectionRecords};
})();
</script>
