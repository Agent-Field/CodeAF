olute;inset:0;transform-origin:0 0}#af-model-lab .wires{position:absolute;overflow:visible;inset:0;pointer-events:none}#af-model-lab .wire{fill:none;stroke:var(--line);stroke-width:1.5}#af-model-lab .wire-label{font-size:11px;fill:var(--quiet);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}#af-model-lab .node{position:absolute;width:160px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:77px;box-shadow:0 3px 8px color-mix(in srgb,var(--ink) 3%,transparent);text-align:left}#af-model-lab .node:hover{background:var(--surface);border-color:var(--accent)}#af-model-lab .node.focus{border-color:var(--accent);background:var(--selected)}#af-model-lab .node strong{display:block;font-weight:500;font-size:12px;line-height:1.45;overflow-wrap:anywhere}#af-model-lab .node small{font-size:10px;display:block;margin-bottom:5px}#af-model-lab .graph-caption{padding:12px 20px;color:var(--quiet);font-size:12px}#af-model-lab .empty{padding:35px 10px;color:var(--quiet)}#af-model-lab table{border-collapse:collapse;width:100%;font-size:12px}#af-model-lab th{text-align:left;font-weight:500;color:var(--quiet);padding:10px 8px}#af-model-lab td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}#af-model-lab td button{padding:2px 0;color:var(--accent)}#af-model-lab .model-note{padding:12px 20px;font-size:12px;color:var(--quiet);border-bottom:1px solid var(--line)}#af-model-lab .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

<div class="shell"><nav class="aml-nav" aria-label="Workspace navigation"></nav><main class="main"><div class="toolbar"><div class="route"></div><div class="titleline"><h2 class="main-title"></h2><span class="quiet scope-count"></span></div><div class="views" aria-label="Representation"><button data-view="browse" aria-pressed="true">Browse</button><button data-view="graph" aria-pressed="false">Connections</button><button data-view="records" aria-pressed="false">Records</button></div></div><div class="viewbody"></div><footer class="footer"><span class="foot-left"></span><span>Read-only exploration</span></footer></main><aside class="inspector" aria-label="Selected record details"></aside></div><span class="sr" role="status" aria-live="polite"></span>
<script>
(()=>{
const root=document.getElementById('af-model-lab'),$=q=>root.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={folder:'Folder',chat:'Chat',task:'Task',ongoing:'Ongoing item',artifact:'Artifact',context:'Shared context'},marks={folder:'F',chat:'C',task:'T',ongoing:'O',artifact:'A',context:'S'};
const data=[];const put=(id,type,title,fields={})=>{const n={id,type,title,...fields};data.push(n);return n};
const folder=(id,title,members=[])=>put(id,'folder',title,{members});
folder('acme','Acme',['engineering','growth','brand']);folder('engineering','Engineering',['production','release']);folder('production','Production',['prod-chat','watch-chat','t-health','uptime','report','ops-context-chat']);folder('release','Release 1.8',['release-chat','t-release','file-watch']);folder('growth','Growth',['launch','brand']);folder('launch','September launch',['launch-chat','report','launch-copy','campaign']);folder('brand','Brand',['brand-chat','brand-guide']);folder('personal','Personal',['travel','learning']);folder('travel','Japan trip',['travel-chat','itinerary','travel-reminder']);folder('learning','Learning',['learning-chat','reading']);
const journal=(user,assistant)=>[{kind:'message',role:'user',text:user},{kind:'message',role:'assistant',text:assistant}];
const chat=(id,title,words,answer,tasks=[],extra={})=>put(id,'chat',title,{workspace:'/mock/acme',state:'idle',journal:journal(words,answer),tasks,...extra});
chat('prod-chat','Production readiness','Check the deployed checkout app and leave a report.','I’ll check the health endpoint, then inspect checkout behaviour.',['t-health','t-checkout'],{journal:[{kind:'message',role:'user',text:'Check the deployed checkout app and leave a report.'},{kind:'message',role:'assistant',text:'I’ll check the health endpoint, then inspect checkout behaviour.'},{kind:'tool call',name:'shell',text:'curl https://checkout.example/health'},{kind:'tool result',name:'shell',text:'HTTP 200 · {"status":"ok"}'},{kind:'message',role:'assistant',text:'Health is responding. The checkout check is still running.'}]});
chat('watch-chat','Keep an eye on production','Watch checkout every twenty minutes. If it is unhealthy, investigate and leave a report. Do not deploy changes.','The ongoing item is saved with that condition and action.');
chat('ops-context-chat','Production follow-up','The staging endpoint has changed to staging.checkout.example.','The shared context now has the updated endpoint.');
chat('release-chat','Prepare release 1.8','Review the release notes and build the candidate.','The build and note review are complete.',['t-release','t-notes']);
chat('launch-chat','September launch planning','Prepare launch copy using the latest readiness report.','The report is available from this folder too.',['t-copy']);
chat('brand-chat','Brand voice','Our writing should be direct, specific and calm.','I’ve recorded this wording as shared context.');
chat('travel-chat','Plan two weeks in Japan','Make a flexible plan for Kyoto and Tokyo.','Here is the itinerary with a quiet first day.',['t-trip'],{workspace:'/mock/personal/travel'});
chat('learning-chat','Study distributed systems','Help me understand leases and fencing tokens.','Let’s work through a stale writer example.',[],{workspace:'/mock/personal/learning'});
chat('loose-chat','A thought on pricing','Could usage pricing be easier for small teams?','Let’s compare how three kinds of teams would experience it.');
chat('loose-travel','Weekend by the lake','What should we consider for a quiet weekend?','Travel time, weather and how much planning you want.',[],{workspace:'/mock/personal'});
const task=(id,title,owner,brief,state='done',dependsOn=[],parent=null,outputs=[])=>put(id,'task',title,{owner,brief,acceptance:'Leave a concrete result that answers the request.',state,dependsOn,parent,outputs,journal:journal(brief,state==='running'?'Work is in progress.':'The requested check is complete.'),result:state==='running'?'':title+' completed.'});
task('t-health','Check endpoint health','prod-chat','Read the deployed health endpoint.','done',[],null,['report']);task('t-checkout','Inspect checkout','prod-chat','Exercise checkout after the health check.','running',['t-health'],'t-health');task('t-release','Build release candidate','release-chat','Build the release candidate.');task('t-notes','Review release notes','release-chat','Review notes against the release diff.','done',[],'t-release');task('t-copy','Draft launch copy','launch-chat','Draft copy based on the readiness report.','done',[],null,['launch-copy']);task('t-trip','Draft itinerary','travel-chat','Plan Kyoto and Tokyo.','done',[],null,['itinerary']);
const artifact=(id,title,path,available=true,preview='')=>put(id,'artifact',title,{path,available,preview});
artifact('report','readiness.md','/mock/acme/reports/readiness.md',true,'# Production readiness\n\nHealth endpoint: responding.\nCheckout flow: follow-up in progress.\n\nThis same file is listed in Production and September launch.');artifact('launch-copy','launch-copy.md','/mock/acme/launch/copy.md',true,'# Launch draft\n\nA calmer way to keep your work moving.');artifact('brand-guide','voice.md','/mock/acme/brand/voice.md',true,'Direct. Specific. Calm.');artifact('itinerary','japan-itinerary.md','/mock/personal/travel/japan.md',true,'Day 1–4: Kyoto\nDay 5–7: countryside\nDay 8–14: Tokyo');artifact('missing-file','old-budget.csv','/mock/personal/travel/old-budget.csv',false);artifact('run-log','Latest monitoring run','/mock/acme/runs/uptime/last.jsonl',true,'Check completed. The service recovered; no deployment was made.');
const ongoing=(id,title,origin,when,action,extra={})=>put(id,'ongoing',title,{origin,originalWords:when.words,workspace:'/mock/acme',when,action,grant:'Observe and report; no deployment.',limits:{perRunUSD:0.5,maxPerDay:12},state:'active',retainedActivity:[{at:'2026-09-09 16:20',kind:'latest check',text:'No action needed.'}],...extra});
ongoing('uptime','Watch checkout health','watch-chat',{kind:'probe',words:'Check every twenty minutes; act when checkout is unhealthy.',probe:{command:'curl https://checkout.example/health'},every:'20m'},{kind:'task',brief:'Investigate the failure and write a report.'},{originalWords:'Watch checkout every twenty minutes. If it is unhealthy, investigate and leave a report. Do not deploy changes.',lastRun:'run-log',retainedActivity:[{at:'2026-09-09 16:20',kind:'latest check',text:'HTTP 200. No action needed.'},{at:'2026-09-08 10:40',kind:'retained run',text:'Investigated a timeout; service recovered. No changes deployed.'}]});
ongoing('file-watch','Release file changes','release-chat',{kind:'file',words:'Tell me when the release notes change.',glob:'release/notes.md'},{kind:'say',text:'Release notes changed.'});
ongoing('campaign','Weekly campaign recap','launch-chat',{kind:'every',words:'Summarize the campaign each Monday.',every:'0 9 * * 1'},{kind:'task',brief:'Write a campaign recap.'},{state:'paused'});
ongoing('travel-reminder','Check train reservations','travel-chat',{kind:'at',words:'Remind me on September 20.',at:'2026-09-20T09:00:00-04:00'},{kind:'say',text:'Check train reservations.'},{workspace:'/mock/personal/travel',grant:'Send this reminder.'});
ongoing('reading','Study when idle','learning-chat',{kind:'idle',words:'When the machine has been idle for an hour.',idleFor:'1h'},{kind:'task',brief:'Prepare the next reading exercise.'},{workspace:'/mock/personal/learning'});
ongoing('api-rule','Keep the public API stable','prod-chat',{kind:'hold',words:'Keep the public API stable.'},null,{grant:'Keep the public API stable.',limits:{},retainedActivity:[],originalWords:'Keep the public API stable.'});
const revision=(number,text,source,targets,withdrawn=false)=>({number,title:'Production endpoints',text,source,targets,withdrawn});
put('endpoints','context','Production endpoints',{currentRevision:2,revisions:[revision(1,'Production: checkout.example. Staging: old-stage.checkout.example.','prod-chat',['production']),revision(2,'Production: checkout.example. Staging: staging.checkout.example.','ops-context-chat',['production','release','t-checkout'])]});
put('voice','context','Writing voice',{currentRevision:1,revisions:[{number:1,title:'Writing voice',text:'Write directly, specifically and calmly.',source:'brand-chat',targets:['brand','launch-chat','launch-copy'],withdrawn:false}]});
put('old-context','context','Old launch window',{currentRevision:2,revisions:[{number:1,title:'Old launch window',text:'Tentative launch: September 12.',source:'launch-chat',targets:['launch'],withdrawn:false},{number:2,title:'Old launch window',text:'Tentative launch: September 12.',source:'launch-chat',targets:['launch'],withdrawn:true}]});
put('health-context','context','Health endpoint format',{currentRevision:1,revisions:[{number:1,title:'Health endpoint format',text:'The health endpoint returns a JSON status field.',source:'t-health',targets:['uptime'],withdrawn:false}]});
put('guide-context','context','Published voice guide',{currentRevision:1,revisions:[{number:1,title:'Published voice guide',text:'The current guide uses direct, specific and calm language.',source:'brand-guide',targets:['brand','launch-copy'],withdrawn:false}]});
const byId=new Map(data.map(n=>[n.id,n]));
byId.get('production').members.push('api-rule');byId.get('travel').members.push('missing-file');
// Extra records exercise paging and search. Every generated task has one owning chat.
const topics=[['production','Reliability'],['release','Release'],['launch','Campaign'],['brand','Brand'],['travel','Trip'],['learning','Learning']];
for(let i=0;i<120;i++){const [home,topic]=topics[i%topics.length],c=chat('sample-c-'+i,topic+' discussion '+String(i+1).padStart(3,'0'),'Let’s continue our '+topic.toLowerCase()+' work.','The next step and current notes are here.',['sample-t-'+i]);const t=task('sample-t-'+i,topic+' follow-up '+String(i+1).padStart(3,'0'),c.id,'Complete the agreed follow-up.');byId.set(c.id,c);byId.set(t.id,t);if(i%17!==0)byId.get(home).members.push(c.id);}
const state={scope:'production',selected:'production',view:'browse',tab:'details',path:['acme','engineering','production'],q:'',page:0,edgePage:0,relation:'all',revisions:{},back:[],pan:{x:0,y:0,z:1}};
const design={dense:false,edgeLabels:true,inspectorWidth:320};
function rev(n){return n.revisions.find(r=>r.number===(state.revisions[n.id]??n.currentRevision))||n.revisions.at(-1)}
function edges(){const all=[];const edge=(from,to,kind,detail='')=>{if(byId.has(from)&&byId.has(to))all.push({from,to,kind,detail})};for(const n of data){if(n.type==='folder')n.members.forEach(id=>edge(n.id,id,'member'));if(n.type==='chat')n.tasks.forEach(id=>edge(n.id,id,'owns task'));if(n.type==='task'){n.dependsOn.forEach(id=>edge(n.id,id,'depends on'));if(n.parent)edge(n.id,n.parent,'delegated by');n.outputs.forEach(id=>edge(n.id,id,'output'))}if(n.type==='ongoing'){edge(n.id,n.origin,'origin');if(n.lastRun)edge(n.id,n.lastRun,'latest run file')}if(n.type==='context'){const r=rev(n);edge(n.id,r.source,'source','r'+r.number);r.targets.forEach(id=>edge(n.id,id,'target','r'+r.number+(r.withdrawn?' · withdrawn':'')))}}return all}
const memberships=id=>data.filter(n=>n.type==='folder'&&n.members.includes(id));
function pool(){if(state.q)return data.filter(n=>(n.title+' '+n.id+' '+names[n.type]+' '+(n.path||'')).toLowerCase().includes(state.q.toLowerCase()));if(state.scope==='all')return data;if(state.scope==='unfiled')return data.filter(n=>n.type==='chat'&&!memberships(n.id).length);if(state.scope==='ongoing')return data.filter(n=>n.type==='ongoing');const f=byId.get(state.scope);return f?.type==='folder'?f.members.map(id=>byId.get(id)):[]}
const linkedContexts=id=>data.filter(n=>n.type==='context'&&rev(n).targets.includes(id));
const status=n=>n.type==='context'?'r'+rev(n).number+(rev(n).withdrawn?' · withdrawn':''):n.type==='artifact'?n.available?'available':'unavailable':n.state||'';
const typeStyle=n=>'--type:var(--'+(n.type==='folder'?'accent':n.type)+')';
const ref=id=>byId.has(id)?'<button class="ref" data-select="'+esc(id)+'">'+esc(byId.get(id).title)+'</button>':'Unavailable reference';
const section=(title,body)=>'<section class="section-body"><h3>'+title+'</h3>'+body+'</section>';
const field=(k,v)=>v===undefined||v===null||v===''?'':'<div class="kv"><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>';
function remember(){state.back.push({scope:state.scope,selected:state.selected,path:[...state.path],q:state.q,view:state.view});if(state.back.length>30)state.back.shift()}
function select(id,focus=false){if(!byId.has(id))return;remember();state.selected=id;state.tab='details';state.edgePage=0;state.pan={x:0,y:0,z:1};if(focus)state.view='graph';render();$('.sr').textContent=byId.get(id).title+' selected.'}
function openFolder(id){remember();const f=byId.get(id);if(f?.type!=='folder')return;state.path=state.scope===id?state.path:byId.get(state.scope)?.members?.includes(id)?[...state.path,id]:[id];state.scope=id;state.selected=id;state.q='';state.page=0;state.edgePage=0;state.tab='details';$('input').value='';render()}
function navigation(){const roots=data.filter(n=>n.type==='folder'&&!memberships(n.id).length);$('.aml-nav').innerHTML='<button data-scope="all" aria-pressed="'+(state.scope==='all')+'">All records</button><button data-scope="unfiled" aria-pressed="'+(state.scope==='unfiled')+'">Unfiled chats</button><button data-scope="ongoing" aria-pressed="'+(state.scope==='ongoing')+'">Ongoing work</button><div class="section">Folders</div>'+roots.map(n=>'<button data-open="'+n.id+'" aria-pressed="'+(state.scope===n.id)+'">'+esc(n.title)+'</button>'+n.members.filter(id=>byId.get(id).type==='folder').map(id=>'<button class="sub" data-open="'+id+'" aria-pressed="'+(state.scope===id)+'">'+esc(byId.get(id).title)+'</button>').join('')).join('')+'<div class="section">Explore examples</div><button data-example="context">Context history</button><button data-example="shared">One shared file</button><button data-example="work">Why this runs</button><button data-example="tasks">Work dependencies</button><button data-example="folder">A shared folder</button>'}
function row(n,relation=''){return'<button class="row" data-select="'+n.id+'" '+(n.type==='folder'?'data-folder-row="'+n.id+'"':'')+' aria-pressed="'+(state.selected===n.id)+'"><span class="mark" style="'+typeStyle(n)+'">'+marks[n.type]+'</span><span><span class="name">'+esc(n.title)+'</span><small>'+names[n.type]+(relation?' · '+esc(relation):'')+(memberships(n.id).length>1?' · '+memberships(n.id).length+' folders':'')+'</small></span><span class="state">'+esc(status(n))+(n.type==='folder'?' ↗':'')+'</span></button>'}
function pager(total){return total>12?'<div class="pagination"><button data-page="-1" '+(state.page===0?'disabled':'')+'>Previous</button><small>'+(state.page*12+1)+'–'+Math.min(total,state.page*12+12)+' of '+total+'</small><button data-page="1" '+((state.page+1)*12>=total?'disabled':'')+'>Next</button></div>':''}
function browse(){const list=pool(),start=state.page*12,f=byId.get(state.scope),contexts=!state.q&&f?.type==='folder'?linkedContexts(f.id):[];return'<div class="list"><div class="group-title"><span>'+(!state.q&&f?.type==='folder'?'Direct members · stored order':'Records')+'</span><span>'+list.length+'</span></div>'+list.slice(start,start+12).map(n=>row(n)).join('')+(!list.length?'<div class="empty">No records in this view.</div>':'')+pager(list.length)+(contexts.length?'<div class="group-title"><span>Context targeting this folder · separate from membership</span><span>'+contexts.length+'</span></div>'+contexts.map(n=>row(n,'explicit target')).join(''):'')+'</div>'}
function records(){const list=pool();return'<div class="model-note">One row per record. Membership and connections are separate references.</div><div class="list"><table><thead><tr><th>Record</th><th>Kind</th><th>Folders</th><th>State</th></tr></thead><tbody>'+list.slice(state.page*12,state.page*12+12).map(n=>'<tr><td><button data-select="'+n.id+'">'+esc(n.title)+'</button><br><small>'+esc(n.id)+'</small></td><td>'+names[n.type]+'</td><td>'+memberships(n.id).length+'</td><td>'+esc(status(n))+'</td></tr>').join('')+'</tbody></table>'+pager(list.length)+'</div>'}
function connectionEdges(){const relevant=edges().filter(e=>e.from===state.selected||e.to===state.selected);return relevant.filter(e=>state.relation==='all'||(state.relation==='membership'?e.kind==='member':e.kind!=='member'))}
function graphShell(){const ee=connectionEdges();return'<div class="graph-tools"><label class="quiet">Show <select aria-label="Connection types"><option value="all">All relationships</option><option value="membership">Membership</option><option value="other">Other relationships</option></select></label><span><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="fit">Fit</button><button data-zoom="in" aria-label="Zoom in">+</button></span></div><div class="canvas" aria-label="Selected record and its direct connections"><div class="world"></div></div><div class="graph-caption"><span>'+ee.length+' direct relationships · select a connected record to continue</span><div class="pagination"><button data-edges="-1" '+(!state.edgePage?'disabled':'')+'>Previous links</button><small>Drag to pan</small><button data-edges="1" '+((state.edgePage+1)*4>=ee.length?'disabled':'')+'>More links</button></div></div>'}
function drawGraph(){const canvas=$('.canvas');if(!canvas)return;const w=canvas.clientWidth,h=400,n=byId.get(state.selected),all=connectionEdges(),ee=all.slice(state.edgePage*4,state.edgePage*4+4),nodeW=150,cx=w<690?20:w/2-nodeW/2,cy=160;const incoming=ee.filter(e=>e.to===n.id),outgoing=ee.filter(e=>e.from===n.id),nodes=new Map([[n.id,{n,x:cx,y:cy}]]);const place=(list,left)=>{const ids=[...new Set(list.map(e=>left?e.from:e.to))];ids.forEach((id,i)=>{if(nodes.has(id))return;nodes.set(id,{n:byId.get(id),x:left?14:w-nodeW-14,y:(h-ids.length*95)/2+i*95})})};if(w<690){const ids=[...new Set(ee.map(e=>e.from===n.id?e.to:e.from))];ids.forEach((id,i)=>nodes.set(id,{n:byId.get(id),x:w-nodeW-20,y:(h-ids.length*95)/2+i*95}))}else{place(incoming,true);place(outgoing,false)}let paths='';for(const e of ee){const a=nodes.get(e.from),b=nodes.get(e.to);if(!a||!b)continue;const right=b.x>a.x,x1=a.x+(right?nodeW:0),x2=b.x+(right?0:nodeW),y1=a.y+39,y2=b.y+39,mid=(x1+x2)/2;const offset=ee.filter(q=>q.from===e.from&&q.to===e.to).indexOf(e)*18;paths+='<path class="wire" d="M'+x1+','+(y1+offset)+' C'+mid+','+(y1+offset)+' '+mid+','+(y2+offset)+' '+x2+','+(y2+offset)+'" marker-end="url(#aml-arrow)"/>'+(design.edgeLabels?'<text class="wire-label" text-anchor="middle" x="'+mid+'" y="'+((y1+y2)/2-8+offset)+'">'+esc(e.kind)+(e.detail?' · '+esc(e.detail):'')+'</text>':'')}
$('.world').innerHTML='<svg class="wires" width="'+w+'" height="400" aria-hidden="true"><defs><marker id="aml-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--quiet)"/></marker></defs>'+paths+'</svg>'+[...nodes.values()].map(p=>'<button class="node '+(p.n.id===state.selected?'focus':'')+'" data-select="'+p.n.id+'" style="left:'+p.x+'px;top:'+p.y+'px;width:'+nodeW+'px"><small>'+names[p.n.type]+(status(p.n)?' · '+esc(status(p.n)):'')+'</small><strong>'+esc(p.n.title)+'</strong></button>').join('');transform()}
function transform(){const world=$('.world');if(world)world.style.transform='translate('+state.pan.x+'px,'+state.pan.y+'px) scale('+state.pan.z+')'}
function history(n){return n.journal.map((e,i)=>'<div class="entry"><div class="who">'+String(i+1).padStart(2,'0')+' · '+esc(e.role||e.kind)+(e.name?' · '+esc(e.name):'')+'</div><p>'+esc(e.text)+'</p></div>').join('')}
function details(n){if(n.type==='folder')return'<dl>'+field('Name',n.title)+field('Members',n.members.length)+field('Structure','Ordered, unique references')+'</dl>'+section('Open this folder','<button class="ref" data-open="'+n.id+'">Browse '+esc(n.title)+' →</button>')+section('Reached from',memberships(n.id).map(p=>ref(p.id)).join('<br>')||'<p class="note">No containing folder.</p>')+section('First members',n.members.slice(0,6).map(id=>'<div>'+ref(id)+'</div>').join(''))+'<p class="note">A folder has no wake condition or execution state. Its referenced records keep their own state.</p>';
if(n.type==='chat')return'<dl>'+field('State',n.state)+field('Workspace',n.workspace)+'</dl>'+section('Owned tasks',n.tasks.map(id=>'<div>'+ref(id)+'</div>').join('')||'<p class="note">No tasks.</p>')+section('Journal · ordered entries',history(n));
if(n.type==='task')return'<dl>'+field('State',n.state)+'</dl>'+section('Brief','<p class="quote">'+esc(n.brief)+'</p>')+section('Acceptance','<p class="note">'+esc(n.acceptance)+'</p>')+section('Owning chat',ref(n.owner))+section('Must finish first',n.dependsOn.map(ref).join('<br>')||'<p class="note">No dependencies.</p>')+section('Delegated by',n.parent?ref(n.parent):'<p class="note">No parent task.</p>')+section('Result',n.result?'<p class="note">'+esc(n.result)+'</p>':'<p class="note">No result yet.</p>')+(n.outputs.length?section('Output references',n.outputs.map(ref).join('<br>')):'')+section('Task journal',history(n));
if(n.type==='artifact')return'<dl>'+field('Path',n.path)+field('Availability',n.available?'Available':'Unavailable')+'</dl>'+section('Listed in',memberships(n.id).map(p=>ref(p.id)).join('<br>')||'<p class="note">No folder membership.</p>')+(n.available?section('File preview · synthetic','<pre>'+esc(n.preview)+'</pre>'):'<p class="note">The reference remains even when the path is unavailable.</p>');
if(n.type==='context'){const r=rev(n);return'<label class="quiet">Revision <select aria-label="Context revision">'+n.revisions.map(v=>'<option value="'+v.number+'" '+(v.number===r.number?'selected':'')+'>r'+v.number+(v.number===n.currentRevision?' · current':' · historical')+(v.withdrawn?' · withdrawn':'')+'</option>').join('')+'</select></label><p class="quote">'+esc(r.text)+'</p><dl>'+field('Status',r.withdrawn?'Withdrawn':r.number===n.currentRevision?'Current revision':'Historical revision')+field('History','Immutable revisions')+'</dl>'+section('Source of this revision',ref(r.source))+section('Explicit targets',r.targets.map(id=>'<div>'+ref(id)+'</div>').join('')||'<p class="note">No explicit targets.</p>')+'<p class="note">Targets identify attached context. They do not establish permission or prove a particular run used it.</p>'}
if(n.type==='ongoing')return'<dl>'+field('State',n.state)+field('Workspace',n.workspace)+'</dl>'+section('Original request','<p class="quote">'+esc(n.originalWords)+'</p>')+section('Origin',ref(n.origin))+section('Wake condition','<dl>'+field('Kind',n.when.kind)+field('Words',n.when.words)+field('Cadence',n.when.every)+field('At',n.when.at)+field('Files',n.when.glob)+field('Idle for',n.when.idleFor)+field('Probe',n.when.probe?.command)+'</dl>')+section('Action',n.action?'<dl>'+field('Kind',n.action.kind)+field('Work',n.action.brief||n.action.text)+'</dl>':'<p class="note">This held rule never wakes; it has no action.</p>')+section('Grant','<p class="note">'+esc(n.grant)+'</p>')+section('Limits','<dl>'+Object.entries(n.limits).map(([k,v])=>field(k,v)).join('')+'</dl>')+section('Retained activity',n.retainedActivity.map(a=>'<div class="entry"><div class="who">'+esc(a.at)+' · '+esc(a.kind)+'</div>'+esc(a.text)+'</div>').join('')||'<p class="note">No retained activity.</p>')+(n.lastRun?section('Latest run location',ref(n.lastRun)):'')+'<p class="note">Latest checks and retained runs are not a complete history of every check.</p>';
return''}
function relations(n){const ee=edges().filter(e=>e.from===n.id||e.to===n.id);return ee.length?ee.map(e=>{const out=e.from===n.id;return'<div class="relation"><small>'+(out?'Outgoing → ':'Incoming ← ')+esc(e.kind)+(e.detail?' · '+esc(e.detail):'')+'</small>'+ref(out?e.to:e.from)+'</div>'}).join(''):'<p class="note">No stored references in this mock.</p>'}
function raw(n){const copy={...n};if(n.type==='artifact')delete copy.preview;return '<p class="note">Simplified logical fields · synthetic values. File preview content is not part of an artifact reference.</p><pre>'+esc(JSON.stringify(copy,null,2))+'</pre>'+section('Derived incoming memberships','<pre>'+esc(JSON.stringify(memberships(n.id).map(p=>p.id),null,2))+'</pre>')}
function inspector(){const n=byId.get(state.selected);const outside=state.view!=='graph'&&!pool().some(x=>x.id===n.id)&&!(n.type==='context'&&rev(n).targets.includes(state.scope));$('.inspector').innerHTML='<div class="eyebrow">'+names[n.type]+'</div><h2>'+esc(n.title)+'</h2><div class="recordkey">'+esc(n.id)+'</div>'+(outside?'<p class="note">Selected record is outside this list.</p>':'')+'<div class="ins-tabs"><button data-tab="details" aria-pressed="'+(state.tab==='details')+'">Details</button><button data-tab="relations" aria-pressed="'+(state.tab==='relations')+'">Relations</button><button data-tab="data" aria-pressed="'+(state.tab==='data')+'">Data</button></div>'+(state.tab==='details'?details(n):state.tab==='relations'?relations(n):raw(n))}
function render(){navigation();root.style.setProperty('--ins-width',design.inspectorWidth+'px');$('.shell').style.gridTemplateColumns='166px minmax(480px,1fr) '+design.inspectorWidth+'px';const title=state.q?'Search results':state.view==='graph'?byId.get(state.selected).title:byId.get(state.scope)?.title||({all:'All records',unfiled:'Unfiled chats',ongoing:'Ongoing work'}[state.scope]);$('.main-title').textContent=title;$('.scope-count').textContent=state.view==='graph'?'Direct connections':pool().length+' records';$('.route').innerHTML='<button data-back '+(!state.back.length?'disabled':'')+'>← Back</button><span class="quiet">/</span><button data-scope="all">Workspace</button>'+state.path.map((id,i)=>'<span class="quiet">/</span><button data-route="'+i+'">'+esc(byId.get(id).title)+'</button>').join('');root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));$('.viewbody').innerHTML=state.view==='browse'?browse():state.view==='graph'?graphShell():records();if(state.view==='graph'){$('[aria-label="Connection types"]').value=state.relation;drawGraph()}inspector();$('.foot-left').textContent=data.length+' synthetic records · '+edges().length+' references'+(Object.keys(state.revisions).some(id=>state.revisions[id]!==byId.get(id).currentRevision)?' · historical revision view':'');if(design.dense)root.querySelectorAll('.row').forEach(el=>el.style.padding='7px 9px')}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.view){state.view=d.view;state.edgePage=0;state.pan={x:0,y:0,z:1};render()}else if(d.tab){state.tab=d.tab;inspector()}else if(d.select){select(d.select)}else if(d.open){openFolder(d.open)}else if(d.scope){remember();state.scope=d.scope;state.path=[];state.q='';state.page=0;state.view='browse';$('input').value='';render()}else if(d.route!==undefined){const path=state.path.slice(0,+d.route+1);openFolder(path.at(-1));state.path=path;render()}else if(d.back!==undefined){const prev=state.back.pop();if(prev){Object.assign(state,prev);state.page=0;state.edgePage=0;$('input').value=state.q;render()}}else if(d.page){state.page+=+d.page;render();$('.viewbody').scrollTop=0}else if(d.edges){state.edgePage+=+d.edges;render()}else if(d.zoom){state.pan=d.zoom==='fit'?{x:0,y:0,z:1}:{...state.pan,z:Math.max(.65,Math.min(1.8,state.pan.z*(d.zoom==='in'?1.15:1/1.15)))};transform()}else if(d.example){const ids={context:'endpoints',shared:'report',work:'uptime',tasks:'t-checkout',folder:'brand'};state.relation='all';select(ids[d.example],true)}});
root.addEventListener('dblclick',e=>{const el=e.target.closest('[data-folder-row]');if(el)openFolder(el.dataset.folderRow)});
root.addEventListener('change',e=>{if(e.target.matches('[aria-label="Context revision"]')){state.revisions[state.selected]=+e.target.value;state.edgePage=0;render()}if(e.target.matches('[aria-label="Connection types"]')){state.relation=e.target.value;state.edgePage=0;render()}});
$('input').addEventListener('input',e=>{state.q=e.target.value;state.page=0;if(state.view==='graph')state.view='browse';render()});
let drag=null;root.addEventListener('pointerdown',e=>{if(e.target.closest('.canvas')&&!e.target.closest('button')){drag={x:e.clientX,y:e.clientY,px:state.pan.x,py:state.pan.y};e.target.setPointerCapture(e.pointerId)}});root.addEventListener('pointermove',e=>{if(drag){state.pan.x=drag.px+e.clientX-drag.x;state.pan.y=drag.py+e.clientY-drag.y;transform()}});root.addEventListener('pointerup',()=>drag=null);root.addEventListener('pointercancel',()=>drag=null);
new ResizeObserver(()=>{if(state.view==='graph')drawGraph()}).observe($('.main'));render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'dense',{label:'Compact rows'});tweak.addToggle(design,'edgeLabels',{label:'Relationship labels'});tweak.addSlider(design,'inspectorWidth',{label:'Inspector width',min:280,max:400,step:20,unit:'px'})}
})();
</script>
</div>
