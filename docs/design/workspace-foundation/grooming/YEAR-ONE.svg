<text x="450" y="123" class="label">DASHED LINKS = SELECTED RELATIONS</text>
<text x="960" y="123" class="label">STATUS = THE WORK INSIDE</text>
<rect x="25" y="153" width="1085" height="610" rx="18" fill="#f1f5f3" stroke="#d3ddda"/>
