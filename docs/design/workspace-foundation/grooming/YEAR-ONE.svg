<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc"><title id="title">One year with aforge: a startup CTO's workspace</title><desc id="desc">Illustrative future view. Nested folder boxes organize chats, work, outputs and decisions. Selected labelled links connect related records across folders. App and production is expanded to show ongoing responsibility, current execution and links to other folders. Folder summaries distinguish running, waiting and your call. This is not an implemented interface or real user data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#819496"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#263c40;font-size:21px}.title{font-size:35px;font-weight:700}.heading{font-size:26px;font-weight:700}.label{font-size:17px;letter-spacing:1.2px;font-weight:700;fill:#65797b}.small{font-size:18px;fill:#607578}.tiny{font-size:16px;fill:#607578}.edge{fill:none;stroke:#819496;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#arrow)}.linklabel{font-size:16px;fill:#526e71;paint-order:stroke;stroke:#f1f5f3;stroke-width:7px}.green{fill:#267668}.amber{fill:#9a6625}</style><rect width="1700" height="1180" fill="#fafbf8"/>
<text x="35" y="52" class="title">Your aforge, after one year</text>
<text x="35" y="86" class="small">A startup CTO’s accumulated work, context and ongoing responsibilities — an illustrative future view.</text>
