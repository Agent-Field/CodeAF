<text x="405" y="896" class="small">Reading · experiments · notes</text>
<rect x="749" y="842" width="338" height="66" rx="12" fill="#fafbf8" stroke="#d3ddda"/>
<text x="767" y="872">Home</text>
<text x="767" y="896" class="small">Documents · recurring admin</text>
<path d="M705 398 H750 V470 H1120 V416 H1129" class="edge"/>
<text x="943" y="461" class="linklabel">expand folder</text>
<rect x="1132" y="153" width="543" height="780" rx="18" fill="#fff" stroke="#80ac9e"/>
<text x="1158" y="191" class="label">ZOOM INTO THE SAME FOLDER</text>
<text x="1158" y="233" class="heading">Startup / App &amp; production</text>
<text x="1158" y="265" class="small">The folder holds work; it does not run itself.</text>
<rect x="1158" y="287" width="491" height="108" rx="12" fill="#fafbf8" stroke="#d3ddda"/>
<text x="1176" y="318" class="heading">Chats &amp; outputs</text>
<text x="1176" y="348">Deployment discussion · incident review</text>
<text x="1176" y="377">Code · release notes · past outcomes</text>
<rect x="1158" y="416" width="491" height="262" rx="12" fill="#f0f8f4" stroke="#acd0bf"/>
<text x="1176" y="447" class="heading">Ongoing: keep production healthy</text>
<text x="1176" y="478" class="small">Retains intent, limits and check history</text>
<text x="1176" y="516" style="fill:#267668">Running now: investigate checkout errors</text>
<text x="1176" y="550">Check logs</text>
<text x="1340" y="550">↔</text>
<text x="1380" y="550">Reproduce failure</text>
<text x="1176" y="579" class="small">Temporary cooperating runs, when useful</text>
<text x="1176" y="615">Between checks: waiting for its next wake</text>
<text x="1176" y="651" class="small">Open history · inspect scope · pause or stop</text>
<rect x="1158" y="699" width="491" height="117" rx="12" fill="#fafbf8" stroke="#d3ddda"/>
<text x="1176" y="731" class="heading">Relevant decisions &amp; sources</text>
<text x="1176" y="761">Release limits ← deployment discussion</text>
<text x="1176" y="791">Budget constraint ← Company &amp; finance</text>
<text x="1158" y="850" class="label">Other connections</text>
<text x="1158" y="880">Release → Acme pilot → customer launch</text>
<text x="1158" y="910" class="small">Follow a link to the same record, not a copy.</text>
<rect x="25" y="960" width="1650" height="124" rx="18" fill="#eaf1ef" stroke="#d3ddda"/>
<text x="47" y="997" class="heading">A daily overview is another view of this same workspace</text>
<text x="47" y="1033" style="fill:#267668">Running: checkout investigation</text>
<text x="520" y="1033" style="fill:#9a6625">Your call: Acme pilot scope</text>
<text x="1040" y="1033">Changed: September launch plan</text>
<text x="47" y="1063" class="small">Open an item → see its folder, sources, current result and controls. History stays available without flooding this view.</text>
<text x="35" y="1122" class="small">Design proposal: start with an overview, navigate familiar folders, reveal relationships when useful.</text>
<text x="35" y="1152" class="tiny">The zoomable map and this integrated experience are not built yet. Examples and statuses are fictional; ongoing does not mean constantly executing.</text>
</svg>