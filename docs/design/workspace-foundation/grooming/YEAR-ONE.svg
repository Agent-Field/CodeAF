<text x="47" y="748" class="tiny">Only a few useful links are shown. Selecting a record reveals its exact sources and connections.</text>
<rect x="25" y="784" width="1085" height="149" rx="18" fill="#fff" stroke="#d3ddda"/>
<text x="47" y="821" class="heading">Personal</text>
<text x="180" y="821" class="small">The same workspace also holds life outside the startup</text>
<rect x="47" y="842" width="316" height="66" rx="12" fill="#fafbf8" stroke="#d3ddda"/>
<text x="65" y="872">Travel</text>
<text x="65" y="896" class="small">Conference trip · itinerary</text>
<rect x="387" y="842" width="338" height="66" rx="12" fill="#fafbf8" stroke="#d3ddda"/>
