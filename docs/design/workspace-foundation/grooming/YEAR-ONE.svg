<text x="820" y="250" class="heading">Customers</text>
<text x="820" y="278" class="small">Feedback and commitments</text>
<text x="820" y="314">Acme pilot</text>
<text x="820" y="345">Feedback and promises</text>
<text x="820" y="376">Onboarding guide</text>
<text x="820" y="412" class="small">1 your call</text>
<rect x="48" y="508" width="280" height="218" rx="12" fill="#fff" stroke="#ccd9d4"/>
<text x="66" y="542" class="heading">Launch &amp; growth</text>
<text x="66" y="570" class="small">Campaigns, content and results</text>
