# The task manifest for the shell-pipe-empty-command candidate.
# Same layout as the jsonschema-log-warning fixture; see that file for the
# schema comments. Mined from goreleaser/goreleaser#5929 (merged 2025-07-27).
schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "frontiercode/shell-pipe-empty-command"
description = "Make goreleaser's shell-pipe runner skip a pipe entry whose command list is empty instead of panicking"
authors = []
keywords = ["go", "cli", "release-tooling"]

[metadata]
task_id = "shell-pipe-empty-command"
display_title = "Skip empty shell-pipe commands instead of panicking"
display_description = "goreleaser's shell pipe runner indexes command[0] without a length check; a pipe entry with an empty command list panics the release pipeline. Make the runner skip such an entry silently or with a warning, leaving every other behaviour untouched."
language = "go"
repository_url = "https://github.com/goreleaser/goreleaser"
base_commit_hash = "21eefb16cfc5346f9cbe8fb0513ee1840353c324"
reference_commit_hash = "1d569f4a85c9477f0fc2e13508a82ace8b124c90"
reference_pr = "goreleaser/goreleaser#5929"
license = "MIT (upstream only; fetched at image build time)"

[environment]
docker_image = "frontiercode-shell-pipe-empty-command:env"
os = "linux"
allow_internet = true
network_mode = "public"
cpus = 4
memory_mb = 8192
build_timeout_sec = 2400.0

[agent]
timeout_sec = 7200.0

[verifier]
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
docker_image = "frontiercode-shell-pipe-empty-command:verify"

[[verifier.collect]]
command = "cd /root/repos/goreleaser && git add -A && git diff --binary 21eefb16cfc5346f9cbe8fb0513ee1840353c324 > /logs/artifacts/model.patch"
timeout_sec = 300.0

[rubric]
file = "rubric.toml"
