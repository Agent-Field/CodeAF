# The task manifest for the conflicted-files-refname-crash candidate.
# Same layout as the fixture; see that file for the schema comments.
# Mined from pre-commit/pre-commit#3425 (merged 2025-03-15).
schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "frontiercode/conflicted-files-refname-crash"
description = "Stop pre-commit's conflicted-file enumeration crashing when a tracked file shares a refname"
authors = []
keywords = ["python", "git", "cli"]

[metadata]
task_id = "conflicted-files-refname-crash"
display_title = "Do not crash on a tracked file named like a git ref"
display_description = "pre-commit enumerates a merge's conflicted files with git diff -m HEAD MERGE_HEAD; if the worktree has a tracked file named HEAD or MERGE_HEAD the refname is ambiguous and the command crashes mid-merge. Make the enumeration not crash while still returning the complete set."
language = "python"
repository_url = "https://github.com/pre-commit/pre-commit"
base_commit_hash = "7b88c63ae691cb243c3137bce8fb870523e0a884"
reference_commit_hash = "b7eb412c798424a94ca83c72eed6f97271545dc4"
reference_pr = "pre-commit/pre-commit#3425"
license = "MIT (upstream only; fetched at image build time)"
agent_repo_path = "pre-commit"

[environment]
docker_image = "frontiercode-conflicted-files-refname-crash:env"
os = "linux"
allow_internet = true
network_mode = "public"
cpus = 4
memory_mb = 8192
build_timeout_sec = 2400.0

[agent]
timeout_sec = 7200.0

[verifier]
# The reverse-classical criterion reverts pre_commit/ and must test the
# REVERTED tree; pytest recompiles nothing, so the rebuild only needs to
# succeed (bytecode caches are keyed to source mtime, which the revert sets).
rebuild_command = "find pre_commit -name '*.py' -exec touch {} + && python -c 'import pre_commit.git'"
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
docker_image = "frontiercode-conflicted-files-refname-crash:verify"

[[verifier.collect]]
command = "cd /root/repos/pre-commit && git add -A && git diff --binary 7b88c63ae691cb243c3137bce8fb870523e0a884 > /logs/artifacts/model.patch"
timeout_sec = 300.0

[rubric]
file = "rubric.toml"
