# The task manifest for the dns-extra-records-lowercase candidate.
# Same layout as the shell-pipe-empty-command fixture; see that file for the
# schema comments. Mined from juanfont/headscale#3366 (merged 2026-09-09).
schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "frontiercode/dns-extra-records-lowercase"
description = "Lowercase headscale's DNS extra record names on every path that writes them into the tailcfg DNS config"
authors = []
keywords = ["go", "dns", "networking"]

[metadata]
task_id = "dns-extra-records-lowercase"
display_title = "Lowercase DNS extra record names"
display_description = "headscale's MagicDNS clients match extra records by exact name, but nothing lowercases record names on the way into the tailcfg DNS config, so a user-configured `Printer.fritz.box` never resolves against `printer.fritz.box`. Two paths place extra records into that config — the conversion of the configured DNS block and the runtime setter — and both must normalize record NAMES to lowercase, leaving record types and values untouched."
language = "go"
repository_url = "https://github.com/juanfont/headscale"
base_commit_hash = "f3f6c982209b08fe2734c38832edf74468221069"
reference_commit_hash = "aeb8d29fc967e3cb6cea3ffcc434a4dfa9cd3ca2"
reference_pr = "juanfont/headscale#3366"
license = "BSD-3-Clause (upstream only; fetched at image build time)"
# Where the task tree lives inside the container (grade.sh mounts and grades it).
agent_repo_path = "headscale"

[environment]
docker_image = "frontiercode-dns-extra-records-lowercase:env"
os = "linux"
allow_internet = true
network_mode = "public"
cpus = 4
memory_mb = 8192
build_timeout_sec = 2400.0

[agent]
timeout_sec = 7200.0

[verifier]
# The reverse-classical criterion reverts hscontrol/types and must test the
# REVERTED tree: touch the package's Go sources so the incremental build
# cannot serve stale objects, then rebuild the tree.
rebuild_command = "find hscontrol -name '*.go' -newer go.mod -exec touch {} + && go build ./..."
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
docker_image = "frontiercode-dns-extra-records-lowercase:verify"

[[verifier.collect]]
command = "cd /root/repos/headscale && git add -A && git diff --binary f3f6c982209b08fe2734c38832edf74468221069 > /logs/artifacts/model.patch"
timeout_sec = 300.0

[rubric]
file = "rubric.toml"
