run: follow-up
title: Follow up on stale deals
budget: { per_run: 0.50 }
params:
  deals:
    type: refs
    to: deal
    default: "stage:Qualified,Proposal,Negotiation last_touch<-14d"
steps:
  - id: each
    loop: { over: $params.deals, as: deal, max: 25 }
    steps:
      - id: thread
        tool: gmail.search
        args: { q: "to:{{deal.contacts.email}} newer_than:30d" }
      - id: draft
        agent: CRM agent
        prompt: Draft a short, plain follow-up for {{deal.name}} from the thread.
        retry: { max: 2, backoff: 30s }
      - id: send
        gate: { approval: send, who: $me }
        tool: gmail.send
        args: { draft: $steps.draft.output }
      - id: touch
        records.update: { id: $deal.id, set: { last_touch: $now } }
