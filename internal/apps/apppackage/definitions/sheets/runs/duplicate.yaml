{
  "run": "duplicate",
  "title": "Duplicate worksheet",
  "params": {
    "source": {
      "type": "ref",
      "to": "sheets_worksheet"
    }
  },
  "steps": [
    {
      "id": "copy",
      "records.create": {
        "type": "sheets_worksheet",
        "set": {
          "title": "{{params.source.title}} copy",
          "body": "$params.source.body",
          "column_formats": "$params.source.column_formats"
        }
      }
    }
  ]
}
