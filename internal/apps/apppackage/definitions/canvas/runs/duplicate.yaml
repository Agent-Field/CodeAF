{
  "run": "duplicate",
  "title": "Duplicate board",
  "params": {
    "source": {
      "type": "ref",
      "to": "board"
    }
  },
  "steps": [
    {
      "id": "copy",
      "records.create": {
        "type": "board",
        "set": {
          "title": "$params.source.title",
          "body": "$params.source.body",
          "x": "$params.source.x",
          "y": "$params.source.y"
        }
      }
    }
  ]
}
