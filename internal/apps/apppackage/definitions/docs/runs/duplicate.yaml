{
  "run": "duplicate",
  "title": "Duplicate document",
  "params": {
    "source": {
      "type": "ref",
      "to": "document"
    }
  },
  "steps": [
    {
      "id": "copy",
      "records.create": {
        "type": "document",
        "set": {
          "title": "$params.source.title",
          "body": "$params.source.body"
        }
      }
    }
  ]
}
