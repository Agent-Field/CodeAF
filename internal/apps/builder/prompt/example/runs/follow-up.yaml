run: follow-up
title: Nudge quiet deals
budget: { per_run: 0.30 }
params:
  deals: { type: refs, to: deal, default: "stage:Talking,Terms last_touch<-7d" }
steps:
  - id: each
    loop: { over: $params.deals, as: deal, max: 20 }
    steps:
      - id: load
        records.query: { type: deal, query: "id:{{deal}}", limit: 1 }
      - id: draft
        agent: Partnerships agent
        prompt: "Draft a short, friendly nudge email about the deal {{steps.load.output.name}} (stage {{steps.load.output.stage}})."
        output:
          type: object
          required: [subject, body]
          properties: { subject: { type: string }, body: { type: string } }
      - id: send
        gate: { approval: send, who: $me, title: "Approval needed: send nudge" }
        tool: gmail.send
        as: $me
        args: { subject: $steps.draft.output.subject, body: $steps.draft.output.body }
      - id: touch
        records.update: { type: deal, id: $deal, set: { last_touch: $now } }
